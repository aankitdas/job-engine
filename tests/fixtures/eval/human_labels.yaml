- job_id: 1391
  title: DashMart Variable Schedule Team Member
  company: doordashusa
  description: 'About the Team DashMart is a local-fulfillment center owned and operated
    by DoorDash, offering customers household essentials and other items to their
    doorsteps with speed, reliability, and quality. Customers order their convenience,
    grocery, retail, and prepared foods in the DoorDash app, and our team members
    fulfill orders in a real, brick-and-mortar store, for Dashers to deliver. We’re
    open early and close late - some sites even run 24/7! Shifts: Morning, Day, Evening,
    Weekend, Part-Time About Part-Time Variable Schedule Roles at DashMart As a Variable
    Schedule Operations Associate , instead of a fixed weekly schedule, you largely
    pick up open shifts through our scheduling app. Shifts may open ahead of time
    or pop up at the last minute based on business needs. Schedules with available
    openings are posted weekly, and additional shifts may appear through shift swaps
    or peaks in demand. You will be expected to work at least one shift every four
    weeks for a minimum of four hours each shift. Variable Schedule Operations Associates
    will be scheduled for one shift a month to help meet this requirement. This will
    also be a key time to review any relevant changes in processes and company-provided
    tooling, and stay connected with the Site Leadership Team, including your supervisor.
    Reliability and communication are key — when you pick up a shift, we count on
    you to show up on time and complete each shift, while meeting performance expectations.
    You’ll start with DashMart onboarding and initial training ( one shift ) and complete
    one 4-hour on-the-job training shift (must be completed within 14 days) to set
    you up for success, then you can begin choosing shifts based on business needs
    and your schedule. About the Role Picking and Packing orders. Pick orders that
    come through the app, pack the order and hand it off to Dashers. Inventory and
    Spoilage Management. Stock receivables and manage inventory, including shelf life.
    Warehouse Organization. Clean and organize the warehouse. Delight Customers. Ensuring
    substitutions are approved by the customer. You’re excited about this opportunity
    because... Market Competitive pay (10pm-6am will receive a $2/hour premium during
    these hours) AM/PM/Overnight shifts available Opportunity for pay increases twice
    a year based on performance Paid time off (PTO) and sick leave Wellness/gym membership
    reimbursement (up to $75/month) Monthly DashPass subscription (including access
    to Lyft discounts for full-time employees) Employee Assistance Program Career
    advancement opportunities We’re excited about you because… You’re reliable, positive,
    and team-oriented You have experience in grocery, food service, or warehouse operations
    You’re detail-oriented and passionate about fresh food quality and safety You
    can lift up to 50 lbs and work in refrigerated areas (with or without accommodation)
    You have a high school diploma or GED You’re willing to complete a Food Handler’s
    Certification upon hire Notice Regarding Use of AI and Automated Employment Decision
    Tools To streamline our hiring process, DoorDash utilizes an automated recruitment
    tool called Fountain. How it works: Fountain assists our recruiting team by evaluating
    and scoring your responses to screening questions, resume details, and an AI-facilitated
    virtual interview. Your interview will be recorded and transcribed, and the interview
    and accompanying results will always be reviewed by a human reviewer before your
