- job_id: 3651
  title: Senior RTL Engineer, Interconnect Design
  company: openai
  description: "ABOUT THE TEAM\n\nOpenAI’s Hardware organization develops AI-native\
    \ silicon and system-level solutions for the unique demands of advanced AI workloads.\
    \ Building on efforts like Jalapeño, the team is developing future generations\
    \ of AI-native silicon and tightly integrated systems to power the next generation\
    \ of frontier models. By co-designing chips, systems, tools, and methodologies,\
    \ the team helps deliver faster, more efficient, and production-ready hardware\
    \ for OpenAI’s supercomputing platform.\n\n\nABOUT THE ROLE\n\nWe are looking\
    \ for a highly experienced RTL engineer to own critical on- and off-chip interconnect\
    \ components for our custom AI accelerator platform. You will drive the microarchitecture\
    \ and RTL implementation of scalable on-chip communication fabrics connecting\
    \ high-bandwidth compute, memory, and I/O subsystems as well as purpose-built\
    \ off-chip interfaces and protocols needed to enable custom computing at scale.\n\
    \nThis is a senior, hands-on engineering role with broad technical ownership.\
    \ You will drive design from requirements through the full silicon lifecycle,\
    \ from architecture definition and performance analysis through RTL implementation,\
    \ verification closure, physical design convergence, bring-up, and production\
    \ readiness. You will plan and oversee the work of junior engineers and help drive\
    \ and develop productive engineering relationships with external partners and\
    \ help manage partner execution.\n\nThis role is based in San Francisco, CA. We\
    \ use a hybrid work model of 3 days in the office per week and offer relocation\
    \ assistance to new employees.\n\n\nIN THIS ROLE, YOU WILL:\n\n - Own the microarchitecture,\
    \ RTL design, and delivery of major SoC interconnect components, including network-on-chip\
    \ fabrics, switches, routers, bridges, protocol adapters, arbiters, and traffic-management\
    \ logic as well as off-chip protocol bridges and interfaces.\n\n - Drive third\
    \ party engagements to develop novel networking and interface protocols and silicon\
    \ IP while ensuring high quality and design integrity, leveraging deep technical\
    \ and non-technical leadership skills.\n\n - Perform substantial direct microarchitecture\
    \ and RTL coding work.\n\n - Collaborate with architecture and design team members\
    \ on the overall solution and execution plan for cutting-edge large-scale custom\
    \ silicon.\n\n - Work with performance and architecture teams to analyze traffic\
