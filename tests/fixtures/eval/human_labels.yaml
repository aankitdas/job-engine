- job_id: 3539
  title: Lead Safety Engineer, Robotics
  company: openai
  description: "About the Team\n\nOur Robotics team is focused on unlocking general-purpose\
    \ robotics and pushing towards AGI-level intelligence in dynamic, real-world settings.\
    \ Working across the entire model stack, we integrate cutting-edge hardware and\
    \ software to explore a broad range of robotic form factors. We strive to seamlessly\
    \ blend high-level AI capabilities with the constraints of physical systems to\
    \ improve peoples’ lives.\n\n\n\nAbout the Role\n\nWe are seeking a Lead Robotics\
    \ Safety Engineer to define and lead the product safety strategy for our robotics\
