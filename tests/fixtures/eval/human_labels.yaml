- job_id: 2829
  title: Product Manager, Gen AI
  company: scaleai
  description: 'Scale AI builds the data infrastructure that powers the world’s most
    advanced AI. We are the trusted data partner behind frontier model makers and
    enterprise AI teams — providing the high-quality training data, evaluation frameworks,
    and human-feedback systems that make models smarter, safer, and more capable.
    Scale operates as a two-sided marketplace. On the demand side , our customers
    — leading AI labs and enterprises — need precisely labeled, expert-curated data
    to train and evaluate their models. On the supply side , we work with a global
    network of 500,000+ skilled contributors across 100+ countries who perform the
    complex annotation, evaluation, and data-generation tasks that fuel AI progress.
    Product Managers at Scale sit at the intersection of these two sides, shaping
    the systems, tooling, and experiences that make this marketplace work at unprecedented
    quality and scale. We are hiring Product Managers across multiple teams within
    our GenAI organization. These roles span both demand-side products (the tools
    and platforms our customers interact with) and supply-side products (the systems
    that power our contributor ecosystem). Each role offers the opportunity to work
    on high-impact, technically complex problems at the frontier of AI — with dedicated
    engineering, design, and data science teams. About the Role Scale’s GenAI platform
    is how the world’s leading AI companies — from frontier model labs to Fortune
    500 enterprises — create the training data that makes their models best-in-class.
    As a PM here, you are building the systems that directly shape AI model quality.
    These roles are deeply cross-functional. You will work with dedicated engineering,
    design, and data science teams, as well as operations, finance, growth, and customer-facing
