- job_id: 220
  title: Employee Experience Program Manager
  company: notion
  description: |-
    WHO WE ARE

    Notion is the collaborative AI workspace where teams and agents think together https://www.youtube.com/watch?v=vkpYpWfEK5s. We're building one place where your knowledge, projects, meetings, and AI tools live side by side, so work is faster, clearer, and less fragmented. Millions of individuals, small teams, and large companies run their work on Notion.



    Notinos (our employees) are customer zero in bringing this future of work to life. We care about craft, building things that last, and the belief that great work is still fundamentally human. Our goal isn’t to ship the next feature. Each and every team of Notinos is working to set the standard for how humans work together in the AI era. From building a business’s system of record to making and managing AI agents to automating away the busy work, we care deeply about giving our customers more time for their life’s work.




    ABOUT THE ROLE

    We’re looking for an experienced program manager to reinvent our highest-impact employee experience programs. You’ll start by redesigning New Hire Onboarding as a fully immersive experience from Day 1 and continue shaping key moments throughout the employee lifecycle. In everything you do, you’ll obsess over helping Notinos connect more deeply to Notion’s mission, product, customers, and the future we’re building together.

    This role reports to the Global Head of Notino Experience and is based in San Francisco, CA. We work from our offices on Mondays, Tuesdays and Thursdays (our Anchor Days) because we do our best thinking and building together in person. We’re looking for someone who’s excited to work alongside the team during those days.




    WHAT YOU'LL ACHIEVE

     - Build the Onboarding Operating System: Create an end-to-end onboarding experience that’s undeniably Notion, with an AI-powered OS that makes a global process feel deeply personal.

     - Make Day 1 unmistakable: Redesign New Hire Onboarding so every Newtino (new hire) leaves Day 1 thinking “I made the best decision of my career joining Notion,” with a clear connection to our mission and expectations for how we work.

     - Make Notinos our customer zero. Building in Notion is core to Notino identity. Build new rituals and rhythms that compel teams to dogfood our newest features, treat AI as collaborator on real workflows, discover new use cases, and raise the bar for knowledge work in Notion.

     - Invent new experiences that deepen Notino identity: Design and test new programs that connect Notinos to our mission, customers, and product so people feel proud and energized to build the future of knowledge work, together.

     - Scale Notion with taste and agency: Lead through influence and tight partnerships ****with People Operations and local Workplace teams to turn what works into repeatable systems, with clear signals for what to keep, iterate, or retire as Notion evolves.




    SKILLS YOU'LL NEED TO BRING

     - Onboarding maven: You’ve led global new hire onboarding programs end to end.

     - Craft + creativity: You curate employee experiences that are bold and intentional. You have a clear point of view on what will create meaning for Notinos, and what won’t resonate.

     - Outcomes- and impact-driven: You’re not attached to programs or policies. You aim to learn Notion’s culture and product quickly, then use that context to (re)invent what comes next. You measure programs on impact, not participation.

     - Self-guided and intrinsically motivated: You don’t wait for a roadmap. You spot the biggest leverage points in the Notino journey, set direction, and build. You’d rather test an early prototype to get signals from your customer, than wait for all the kinks to be ironed out.

     - Agility across context: You move from crafting a Day 1 moment, to debugging a broken workflow, to aligning global partners, without losing speed or taste.

     - AI fluency: You treat AI as a daily collaborator and you’re eager to teach others to do the same.

     - Cross-functional partnership: You work with leaders and global partners to align on outcomes, understand trade-offs, and co-create solutions that scale.



    Notion is committed to providing highly competitive cash compensation, equity, and benefits. The compensation offered for this role will be based on multiple factors such as location, the role’s scope and complexity, and the candidate’s experience and expertise, and may vary from the range provided below. For roles based in San Francisco, the estimated base salary range for this role is $195,000 - $210,000 per year.



    By clicking “Submit Application”, I understand and agree that Notion and its affiliates and subsidiaries will collect and process my information in accordance with Notion’s Global Recruiting Privacy Policy https://notion.notion.site/Notion-Global-Recruiting-Privacy-Policy-fc3eb4e829354a26a2bb6fd5e289b550. https://dev.notion.so/a3ce416456924276a59de91bca740028?pvs=21



    #LI-Onsite







    A NOTE ON AI

    You don’t need deep AI expertise for every role, but we do expect every Notino to be intellectually curious, drawn to tinkering and discovery, and excited to use AI as a real collaborator in their work. For some roles, AI fluency is a core requirement — when that’s the case, we'll say so explicitly in the qualifications. People who thrive here don’t treat AI as a novelty. They use it to think better, and make their work easier for others to build on.




    EQUAL OPPORTUNITY & ACCOMMODATIONS

    We hire talented people from a wide range of backgrounds. If you’re excited about this role but don’t meet every bullet, we still encourage you to apply. Notion is an equal opportunity employer and does not discriminate on the basis of any legally protected characteristic. Consistent with applicable law, we will consider for employment qualified applicants with arrest and conviction records. Notion provides reasonable accommodations during the application process; if you need one, please let your recruiter know.



    Notion is proud to be an equal opportunity employer. We do not discriminate in hiring or any employment decision based on race, color, religion, national origin, age, sex (including pregnancy, childbirth, or related medical conditions), marital status, ancestry, physical or mental disability, genetic information, veteran status, gender identity or expression, sexual orientation, or other applicable legally protected characteristic. Notion considers qualified applicants with criminal histories, consistent with applicable federal, state and local law. Notion is also committed to providing reasonable accommodations for qualified individuals with disabilities and disabled veterans in our job application procedures. If you need assistance or an accommodation due to a disability, please let your recruiter know.
