- job_id: 3247
  title: Software Engineer, Hardware
  company: openai
  description: "ABOUT THE TEAM\n\nOpenAI’s Hardware organization develops AI-native\
    \ silicon and system-level solutions for the unique demands of advanced AI workloads.\
    \ Building on efforts like Jalapeño, the team is developing future generations\
    \ of AI-native silicon and tightly integrated systems to power the next generation\
    \ of frontier models. By co-designing chips, systems, tools, and methodologies,\
    \ the team helps deliver faster, more efficient, and production-ready hardware\
    \ for OpenAI’s supercomputing platform.\n\n\nABOUT THE ROLE\n\nAs a software engineer\
    \ on the Scaling team, you’ll help build and optimize the low-level stack that\
    \ orchestrates computation and data movement across OpenAI’s supercomputing clusters.\
    \ Your work will involve designing high-performance runtimes, building custom\
    \ kernels, contributing to compiler infrastructure, and developing scalable simulation\
    \ systems to validate and optimize distributed training workloads.\n\nYou will\
    \ work at the intersection of systems programming, ML infrastructure, and high-performance\
    \ computing, helping to create both ergonomic developer APIs and highly efficient\
    \ runtime systems. This means balancing ease of use and introspection with the\
    \ need for stability and performance on our evolving hardware fleet.\n\nThis role\
    \ is based in San Francisco, CA, with a hybrid work model (3 days/week in-office).\
    \ Relocation assistance is available. \n\n\nIN THIS ROLE, YOU WILL:\n\n - Design\
    \ and build APIs and runtime components to orchestrate computation and data movement\
    \ across heterogeneous ML workloads.\n\n - Contribute to compiler infrastructure,\
    \ including the development of optimizations and compiler passes to support evolving\
    \ hardware.\n\n - Engineer and optimize compute and data kernels, ensuring correctness,\
    \ high performance, and portability across simulation and production environments.\n\
    \n - Profile and optimize system bottlenecks, especially around I/O, memory hierarchy,\
    \ and interconnects, at both local and distributed scales.\n\n - Develop simulation\
    \ infrastructure to validate runtime behaviors, test training stack changes, and\
    \ support early-stage hardware and system development.\n\n - Rapidly deploy runtime\
    \ and compiler updates to new supercomputing builds in close collaboration with\
    \ hardware and research teams.\n\n - Work across a diverse stack, primarily using\
    \ Rust and Python, with opportunities to influence architecture decisions across\
    \ the training framework.\n\n\nYOU MIGHT THRIVE IN THIS ROLE IF YOU:\n\n - Have\
    \ a deep curiosity for how large-scale systems work and enjoy making them faster,\
    \ simpler, and more reliable.\n\n - Are proficient in systems programming (e.g.,\
    \ Rust, C++) and scripting languages like Python.\n\n - Have experience in one\
    \ or more of the following areas: compiler development, kernel authoring, accelerator\
    \ programming, runtime systems, distributed systems, or high-performance simulation.\n\
    \n - Are excited to work in a fast-paced, highly collaborative environment with\
    \ evolving hardware and ML system demands.\n\n - Value engineering excellence,\
    \ technical leadership, and thoughtful system design.\n\n\n\nAbout OpenAI\n\n\
    OpenAI is an AI research and deployment company dedicated to ensuring that general-purpose\
    \ artificial intelligence benefits all of humanity. We push the boundaries of\
    \ the capabilities of AI systems and seek to safely deploy them to the world through\
    \ our products. AI is an extremely powerful tool that must be created with safety\
    \ and human needs at its core, and to achieve our mission, we must encompass and\
    \ value the many different perspectives, voices, and experiences that form the\
    \ full spectrum of humanity. \n\nWe are an equal opportunity employer, and we\
    \ do not discriminate on the basis of race, religion, color, national origin,\
    \ sex, sexual orientation, age, veteran status, disability, genetic information,\
    \ or other applicable legally protected characteristic. \n\nFor additional information,\
    \ please see OpenAI’s Affirmative Action and Equal Employment Opportunity Policy\
    \ Statement https://cdn.openai.com/policies/eeo-policy-statement.pdf.\n\nBackground\
    \ checks for applicants will be administered in accordance with applicable law,\
    \ and qualified applicants with arrest or conviction records will be considered\
    \ for employment consistent with those laws, including the San Francisco Fair\
    \ Chance Ordinance, the Los Angeles County Fair Chance Ordinance for Employers,\
    \ and the California Fair Chance Act, for US-based candidates. For unincorporated\
    \ Los Angeles County workers: we reasonably believe that criminal history may\
    \ have a direct, adverse and negative relationship with the following job duties,\
    \ potentially resulting in the withdrawal of a conditional offer of employment:\
    \ protect computer hardware entrusted to you from theft, loss or damage; return\
    \ all computer hardware in your possession (including the data contained therein)\
    \ upon termination of employment or end of assignment; and maintain the confidentiality\
    \ of proprietary, confidential, and non-public information. In addition, job duties\
    \ require access to secure and protected information technology systems and related\
    \ data security obligations.\n\nTo notify OpenAI that you believe this job posting\
    \ is non-compliant, please submit a report through this form https://form.asana.com/?d=57018692298241&k=5MqR40fZd7jlxVUh5J-UeA.\
    \ No response will be provided to inquiries unrelated to job posting compliance.\n\
    \nWe are committed to providing reasonable accommodations to applicants with disabilities,\
    \ and requests can be made via this link https://form.asana.com/?k=bQ7w9h3iexRlicUdWRiwvg&d=57018692298241.\n\
    \nOpenAI Global Applicant Privacy Policy https://cdn.openai.com/policies/global-employee-and-contractor-privacy-policy.pdf\n\
    \nAt OpenAI, we believe artificial intelligence has the potential to help people\
    \ solve immense global challenges, and we want the upside of AI to be widely shared.\
    \ Join us in shaping the future of technology."
