    \ arbitration, virtual channels, flow control, buffering, ordering, quality of\
    \ service, coherency, deadlock avoidance, congestion management, and performance\
    \ monitoring.\n\n - Experience with common on-chip or chip-to-chip protocols and\
    \ interfaces, such as AXI, APB, CXL, PCIe, Ethernet.\n\n - Experience building\
    \ custom networking protocols or protocol extensions.\n\n - Experience working\
    \ designing and implementing subsystems in the context of large scale systems\
    \ built with RDMA/RoCE or other HPC-style system-level interconnects.\n\n - Familiarity\
    \ and deep experience with the full spectrum of industry-standard RTL-adjacent\
    \ development and signoff flows, including lint, CDC/RDC, synthesis, formal verification,\
    \ static timing analysis, power analysis, and design-for-test considerations.\n\
    \n - Experience working closely with architecture, verification, physical design,\
    \ firmware, performance, and post-silicon teams to deliver complex silicon.\n\n\
    \ - Strong judgment in making practical design tradeoffs across performance, power,\
