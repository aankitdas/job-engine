    product development lifecycles, threat modeling complex topologies, and cloud-native
    container security (AWS, Kubernetes). Proficiency in Python, Go, or similar languages
    to architect internal tooling, pipeline automation, and advanced detection/scanning
    engines. Exceptional written and verbal communication skills, with a demonstrated
    ability to navigate ambiguity, influence technical leaders, and manage up and
