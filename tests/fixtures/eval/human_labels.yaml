    organization, guiding technical growth, helping individuals level up their security
    expertise, and accelerating team delivery. Drive proactive vulnerability discovery
    and offensive security testing strategies, executing complex attack chains to
    demonstrate business impact and prioritize cross-functional remediation. Partner
