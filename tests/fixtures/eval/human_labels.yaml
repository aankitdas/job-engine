    \ and safety engineering practices while helping establish the long-term safety\
    \ strategy for our products and organization.\n\nThis role is based in San Francisco,\
    \ CA. This role will be expected to be in office 4 days per week and offer relocation\
    \ assistance to new employees.\n\n\n\nIn this role, you will\n\n - Define and\
    \ lead the product safety strategy for robotic systems across the development\
