# Hard exclude, applied across ALL profiles, not per-profile like
# exclusion_keywords above: a JD requiring US citizenship or a security
# clearance is a hard eligibility mismatch (see identity.toml's F-1 OPT
# work authorization) regardless of which profile the title would otherwise
# route to. Deliberately narrow: this only fires on explicit
# citizenship/clearance/export-control language, never on the absence of
# sponsorship language. See TODO.md's B1-followup and D23 in
# docs/decisions.md for why a general visa-sponsorship detector is out of
# scope here (most JDs never mention sponsorship either way; DOL LCA data
# at the company-selection layer is the right tool for that question, not
# per-job text matching).
citizenship_clearance:
  exclude_phrases:
    - "must be a us citizen"
    - "security clearance"
    - "ability to obtain a security clearance"
    - "itar"
    - "export control"
    - "us person"

employment_type:
  # Ashby's raw_json has a structured `employmentType` field (real values seen
  # in data/jobengine.db: "FullTime"). Greenhouse has no such field at all, so
  # its jobs fall back to the title-text heuristic below.
  exclude_ashby_types:
    - "Intern"
    - "Contract"
    - "Temporary"
    - "PartTime"
  exclude_title_keywords:
    - "intern"
    - "internship"
    - "co-op"
    - "contract"
    - "temporary"
    - "part-time"
    - "part time"

# Deferred, not tuned: see specs/04-sources.md "Open item" and D23 in
# docs/decisions.md. null means no cap is applied yet.
daily_cap: null
